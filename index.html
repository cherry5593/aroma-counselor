function calculateKuubou(daysDiff) {
  let kanshiIndex = daysDiff % 60;
  if (kanshiIndex < 0) kanshiIndex += 60;
  
  let kuubouType;
  let recentYears;
  let nextYears;
  
  if (kanshiIndex >= 0 && kanshiIndex <= 9) {
    kuubouType = '子丑空亡';
    recentYears = '2022年・2023年';
    nextYears = '2034年・2035年';
  } else if (kanshiIndex >= 10 && kanshiIndex <= 19) {
    kuubouType = '戌亥空亡';
    recentYears = '2024年・2025年';
    nextYears = '2036年・2037年';
  } else if (kanshiIndex >= 20 && kanshiIndex <= 29) {
    kuubouType = '申酉空亡';
    recentYears = '2026年・2027年';
    nextYears = '2038年・2039年';
  } else if (kanshiIndex >= 30 && kanshiIndex <= 39) {
    kuubouType = '午未空亡';
    recentYears = '2020年・2021年';
    nextYears = '2032年・2033年';
  } else if (kanshiIndex >= 40 && kanshiIndex <= 49) {
    kuubouType = '辰巳空亡';
    recentYears = '2028年・2029年';
    nextYears = '2040年・2041年';
  } else {
    kuubouType = '寅卯空亡';
    recentYears = '2030年・2031年';
    nextYears = '2042年・2043年';
  }
  
  return {
    type: kuubouType,
    recentYears: recentYears,
    nextYears: nextYears
  };
}
